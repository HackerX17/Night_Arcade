<meta charset="utf-8">
<title>Sandblade Siege</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c9a27a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one full-screen 3D view of the fortress (cannon at the bottom, horde at the top); HUD bar on top, menus as bottom overlays. Single warm desert look in every theme. */
:root {
  --sand-deep: #c98745;
  --cream: #fff6e6;
  --ink: #5a3a20;
  --blue: #2f7de0;
  --ember: #c23b2a;
  --gold: #ffd35c;
  --display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sand-deep); color: var(--cream); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; overscroll-behavior: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; flex-direction: column; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 5px rgba(50, 25, 10, .65);
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lvl { font-family: var(--display); font-size: 20px; letter-spacing: .06em; text-align: center; }
.lvl small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.side { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.side.r { align-items: flex-end; }
.side span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; opacity: .9; }
.side strong { font-size: 26px; font-weight: 800; line-height: 1.05; }
.side.l strong { color: #cfe6ff; }
.side.r strong { color: #ffd2c8; }
.bar { height: 10px; border-radius: 99px; background: var(--ember); overflow: hidden; box-shadow: 0 1px 4px rgba(50,25,10,.35); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1c5fb8, #57a6ff); }
.iconbtn {
  pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,246,230,.5);
  background: rgba(59,42,28,.32); color: var(--cream); font: 600 13px var(--body); cursor: pointer;
}
.iconbtn:focus-visible, .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  text-align: center; gap: 14px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(60,32,14,.82), rgba(60,32,14,0) 62%);
}
.logo { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 7vh); z-index: 11; pointer-events: none; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 84px); letter-spacing: .18em; padding-left: .18em; line-height: 1;
  color: #fff4dc; text-shadow: 0 2px 0 #a8743f, 0 6px 24px rgba(60,30,10,.6); }
.logo p { margin: 10px 0 0; font-size: 15px; letter-spacing: .5em; padding-left: .5em; text-transform: uppercase; color: #fff4dc; font-weight: 700; text-shadow: 0 1px 6px rgba(60,30,10,.7); }
.how { max-width: 34ch; font-size: 16px; line-height: 1.5; text-shadow: 0 1px 6px rgba(50,25,10,.7); }
.how b { color: var(--gold); font-weight: 700; }
.cta { font: 800 18px var(--body); letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--blue); border: 0; border-radius: 999px;
  padding: 16px 44px; cursor: pointer; box-shadow: 0 6px 24px rgba(47,125,224,.5), inset 0 1px 0 rgba(255,255,255,.25); }
.sub { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .9; font-variant-numeric: tabular-nums; }
.result h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 52px); letter-spacing: .06em; color: var(--gold); text-shadow: 0 2px 0 #8a5a22; }
.result p { margin: 0; font-size: 17px; }
.result strong { font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
.stars { font-size: 44px; letter-spacing: .12em; color: var(--gold); text-shadow: 0 2px 0 #8a5a22, 0 0 18px rgba(255,211,92,.5); line-height: 1; }
.stars .off { color: rgba(255,246,230,.28); text-shadow: none; }
.cta.ghost { background: rgba(40,22,10,.55); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); font-size: 14px; padding: 12px 32px; }
#banner { position: fixed; left: 0; right: 0; top: 30%; z-index: 6; pointer-events: none; text-align: center; font: 800 clamp(40px, 13vw, 86px)/1 var(--body);
  letter-spacing: .02em; color: var(--gold); opacity: 0; -webkit-text-stroke: 3px rgba(70,35,12,.9); paint-order: stroke fill; text-shadow: 0 6px 18px rgba(60,30,10,.55); }
#banner small { display: block; font-size: .34em; letter-spacing: .2em; margin-top: 8px; color: var(--cream); -webkit-text-stroke: 0; }
#labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
#labels div { position: absolute; left: 0; top: 0; font: 800 15px var(--body); color: #fff; white-space: nowrap; -webkit-text-stroke: 3px rgba(20,40,90,.85); paint-order: stroke fill; will-change: transform, opacity; }
#labels div.gold { color: var(--gold); -webkit-text-stroke-color: rgba(90,50,10,.9); font-size: 19px; }
#labels div.tag { font-size: 15px; padding: 3px 10px; border-radius: 99px; background: rgba(28,72,150,.82); -webkit-text-stroke: 0; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
#labels div.tag.red { background: rgba(160,40,28,.85); }
#hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh); z-index: 6; pointer-events: none; text-align: center;
  font: 700 14px var(--body); letter-spacing: .24em; text-transform: uppercase; color: var(--cream); text-shadow: 0 1px 6px rgba(50,25,10,.8); transition: opacity .6s; }
#flash { position: fixed; inset: 0; z-index: 7; pointer-events: none; background: #fff3d6; opacity: 0; }
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="flash"></div>
<div id="banner"></div>
<div id="hint" hidden>◀ Drag to aim ▶</div>

<div class="hud" id="hud" hidden>
  <div class="row">
    <div class="side l"><span>Your army</span><strong id="blueN">0</strong></div>
    <div class="lvl" id="lvl">Level 1</div>
    <div class="side r"><span>Horde</span><strong id="redN">0</strong></div>
  </div>
  <div class="row"><div class="bar" style="flex:1"><i id="bar"></i></div><button class="iconbtn" id="pauseBtn" aria-label="Pause">II</button><button class="iconbtn" id="mute" aria-label="Toggle sound">♪</button></div>
</div>

<div class="logo" id="logo"><h1>Sandblade</h1><p>Siege</p></div>

<div class="overlay" id="menu">
  <div class="how"><b>Drag</b> to aim the cannon. Every rider who runs through a gate is multiplied. Find the path through the biggest gates and crush the horde.</div>
  <button class="cta" id="play">Fire</button>
  <div class="sub" id="menuLvl"></div>
</div>

<div class="overlay result" id="pauseMenu" hidden>
  <h2>Paused</h2>
  <button class="cta" id="resume">Resume</button>
  <button class="cta ghost" id="restart">Restart level</button>
</div>

<div class="overlay result" id="win" hidden>
  <div class="stars" id="stars"></div>
  <h2 id="winTitle">Total domination</h2>
  <p><strong id="winCount">0</strong> riders standing</p>
  <div class="sub" id="winSub"></div>
  <button class="cta" id="next">Next level</button>
  <button class="cta ghost" id="again">Replay level</button>
</div>

<script type="module">

const NAMES = ['First Blood', 'Moving Target', 'The Trap', 'Sandstorm', 'Iron Tide', 'No Mercy', 'Red Sea', 'Endless Horde'];
const levelName = (n) => NAMES[(n - 1) % NAMES.length];

// =====================================================================================
// renderer, scene, lights
// =====================================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

{

  }

addEventListener('pointermove', (e) => { if (dragging || e.pointerType === 'mouse') aimAt(e.clientX, e.clientY); }, { passive: true });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointercancel', () => { dragging = false; });
addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true; });
addEventListener('keyup', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false; });
addEventListener('contextmenu', (e) => e.preventDefault());

// =====================================================================================
// flow: menu, play, win, pause
// =====================================================================================
const bannerEl = $('banner'); let bannerAnim = null;
function banner(text, sub) {
  bannerEl.innerHTML = `${text}${sub ? `<small>${sub}</small>` : ''}`; if (bannerAnim) bannerAnim.cancel();
  bannerAnim = bannerEl.animate([{ opacity: 0, transform: 'scale(1.6)' }, { opacity: 1, transform: 'scale(1)', offset: 0.12 }, { opacity: 1, offset: 0.75 }, { opacity: 0, transform: 'scale(.96)' }], { duration: 1500, easing: 'ease-out' });
}
function flash(a) { $('flash').animate([{ opacity: a }, { opacity: 0 }], { duration: 450, easing: 'ease-out' }); }
function updateMenu() { const s = +(store.get('siege-stars-' + level) || 0); $('menuLvl').textContent = `Level ${level} · ${levelName(level)}${s ? ' · ' + '★'.repeat(s) : ''}`; }
$('mute').addEventListener('click', () => { initAudio(); setMuted(!muted); });
$('play').addEventListener('click', start);
$('next').addEventListener('click', () => { level++; store.set('siege-level', String(level)); start(); });
$('again').addEventListener('click', start);
function start() {
  initAudio(); reset(); phase = 'play'; paused = false; aimed = false; $('pauseMenu').hidden = true; labelLayer.hidden = false;
  for (const p of pops) p.t = p.max;
  for (const id of ['menu', 'win', 'logo']) $(id).hidden = true;
  $('hud').hidden = false; $('lvl').innerHTML = `Level ${level}<small>${L.name}</small>`;
  const hint = $('hint'); hint.hidden = false; hint.style.opacity = 1;
  banner(`HORDE OF ${fmt(redStart)}`, L.name); sfx.horn();
}
function win() {
  phase = 'won';
  const stars = elapsed <= L.par ? 3 : elapsed <= L.par * 1.6 ? 2 : 1;
  $('stars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('');
  $('winTitle').textContent = stars === 3 ? 'Total domination' : stars === 2 ? 'Victory' : 'They fell at last';
  $('winCount').textContent = fmt(blueTotal);
  $('winSub').textContent = `${fmt(redStart)} defeated in ${elapsed.toFixed(1)}s · three stars under ${L.par}s`;
  sfx.win(); flash(0.5); banner('VICTORY', `${fmt(redStart)} defeated`);
  const best = +(store.get('siege-stars-' + level) || 0); if (stars > best) store.set('siege-stars-' + level, String(stars));
  setTimeout(() => { if (phase === 'won') { $('hud').hidden = true; $('hint').hidden = true; $('win').hidden = false; labelLayer.hidden = true; } }, 1600);
}
function setPaused(on) { if (on && phase !== 'play') return; paused = on; $('pauseMenu').hidden = !on; if (on) dragging = false; }
$('pauseBtn').addEventListener('click', () => setPaused(true));
$('resume').addEventListener('click', () => setPaused(false));
$('restart').addEventListener('click', () => { setPaused(false); start(); });
addEventListener('keydown', (e) => { if (e.code === 'Escape' || e.code === 'KeyP') setPaused(!paused); }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

function hud() {
  if (phase !== 'play' && phase !== 'won') return;
  $('blueN').textContent = fmt(shownBlue); $('redN').textContent = fmt(shownRed);
  $('bar').style.width = `${clamp(1 - shownRed / redStart, 0, 1) * 100}%`;
}

// =====================================================================================
// main loop
// =====================================================================================
let last = performance.now();
function tick(dt) {
  if ((phase === 'play' || phase === 'won') && !paused) step(dt);
  else if (phase === 'menu') { t += dt; moveGates(); }
  updateCamera(dt);
  draw(); hud();
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000)); last = now;
  if (!window.__hold) tick(dt);
}
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('800 100px Jost'), new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => { reset(); updateMenu(); updateCamera(0, true); requestAnimationFrame(frame); });
if (DEBUG) window.__S = { get state() { return { phase, level, blue: blue.length, red: red.length, blueTotal, redTotal, elapsed, hordeFront, cannon: cannon.x }; }, sim(sec, stp = 1 / 60) { for (let i = 0; i < sec / stp; i++) { if (phase === 'play' || phase === 'won') step(stp); updateCamera(stp); } draw(); hud(); }, aim(x) { cannon.tx = x; }, start, setLevel(n) { level = n; }, blues: () => blue };
</script>
