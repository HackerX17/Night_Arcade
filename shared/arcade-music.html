// My music: play your own songs while any arcade game runs. Songs live in IndexedDB (shared by every page on the same site),

  const urls = new Map(), audio = new Audio(); audio.preload = "auto";

  const idb = (mode, fn) => dbReady.then(() => new Promise((res) => {

    playIco.setAttribute("d", playing ? PAUSE : PLAY); playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");

    $("am-np").innerHTML = t ? `${esc(t.name)}<small>${playing ? "Playing" : "Paused"} · song ${cur + 1} of ${tracks.length}</small>` : tracks.length ? `Ready<small>${tracks.length} song${tracks.length === 1 ? "" : "s"} · press play</small>` : "Nothing playing<small>Add songs from your device to get started</small>";
    if (!tracks.length) { list.innerHTML = '<li class="am-empty">No songs yet. Tap “Add songs” and pick music files from your phone or computer.</li>'; return; }

  });

  playBtn.addEventListener("click", toggle); $("am-next").addEventListener("click", next); $("am-prev").addEventListener("click", prev);
  $("am-shuf").addEventListener("click", () => { st.shuffle = !st.shuffle; save(); render(); });
  const vol = $("am-volume"); vol.value = Math.round(st.volume * 100);
  vol.addEventListener("input", () => { st.volume = vol.value / 100; audio.volume = st.volume; save(); });
  audio.volume = 0.5; if (audio.volume !== 0.5) $("am-volwrap").classList.add("am-hide");   // iPhones fix media volume to the hardware buttons
  audio.volume = st.volume;

  const panelEvent = (open) => window.dispatchEvent(new CustomEvent("arcademusicpanel", { detail: { open } }));   // games can pause while it is open
